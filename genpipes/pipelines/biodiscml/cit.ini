# Continuous integration testing (CIT) overrides for the biodiscml pipeline.
# Uses BioDiscML's fast mode (classificationFastWay): a short, fixed list of
# classifiers instead of the exhaustive search, no leave-one-out and fewer
# bootstrap folds. Meant to check the whole chain end to end in a few
# minutes, not to produce meaningful models. Tested on the colon dataset from
# BioDiscML's release/Test_datasets (62 samples x 2000 genes): ~20 s for
# biomarker_discovery, ~30 s for report.

[DEFAULT]
project_name=cit
cluster_other_arg=-A $RAP_ID
cluster_walltime=0:30:00

[biodiscml]
number_of_best_models=2
cpus=2
ram=4G
# retrieveCorrelatedGenes must stay true (default): -bestmodel only writes the
# *_features.csv files the report reads when it is enabled.
other_options=
  classificationFastWay=true
  ccmd=bayes.NaiveBayes, AUC, top10
  ccmd=trees.J48, MCC, top10
  loocv=false
  bootstrapFolds=10

[biomarker_discovery]
cluster_cpu=2
cluster_mem=8G
cluster_walltime=0:30:00

[report]
cluster_walltime=0:15:00
