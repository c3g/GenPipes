[DEFAULT]
# Cluster
cluster_server = abacus
sequencing_center = McGill_Genome_Centre
cluster_submit_cmd_suffix = | grep "[0-9]"
cluster_other_arg=-m ae -M $JOB_MAIL -W umask=0002
cluster_work_dir_arg=-d
cluster_output_dir_arg=-j oe -o
cluster_job_name_arg=-N
cluster_cmd_produces_job_id=true
cluster_dependency_arg=afterok
cluster_dependency_sep=:
cluster_max_jobs=30000
tmp_dir=${TMPDIR:=/tmp}
portal_output_dir=$PORTAL_OUTPUT_DIR

cluster_walltime = 24:00:00
cluster_cpu = 1
cluster_node = 1

ALL_CPU=32
HALF_CPU=16
QUART_CPU=8
PINT_CPU=4

ALL_MEM=187G
HALF_MEM=90G
QUART_MEM=60G
PINT_MEM=30G
cluster_mem = 5000M per cpu
cluster_queue = -q sw
LARGE_QUEUE = -q lm

# Modules
module_java=mugqic/java/openjdk-jdk1.8.0_72
module_python=mugqic/python/3.10.4
# Packaged by resources/modules/biodiscml_report.sh (jupyter, nbconvert, pandas, numpy, plotly, scipy, scikit-learn)
module_python_report=mugqic/biodiscml_report/1.0
# Python the report module was built against (its modulefile prereq); must match resources/modules/biodiscml_report.sh's PYTHON_VERSION
module_python_report_base=mugqic/python/3.11.1

[biodiscml]
module_biodiscml=mugqic/BioDiscML/1.8.14
class_column_name=biodiscml_class
sampling=true
number_of_best_models=3
# BioDiscML's own default ranking metric; also used to sort/highlight models in the report
number_of_best_models_sorting_metric=AVG_MCC
# Leave empty to use the notebook bundled with the pipeline
report_notebook=
# Weka-level parallelism inside BioDiscML; keep equal to [biomarker_discovery] cluster_cpu
cpus=%(QUART_CPU)s
other_options=
# JVM max heap. Must be set explicitly and stay below [biomarker_discovery]
# cluster_mem: this JDK 8 build isn't cgroup-aware, so without -Xmx it sizes
# its heap from the whole node's RAM and gets OOM-killed by SLURM.
ram=25G
java_other_options=-XX:ParallelGCThreads=2

# cluster_cpu/cluster_mem/cluster_walltime are resolved by GenPipes' scheduler
# per *step* name (e.g. "[biomarker_discovery] cluster_mem=..." for a job
# named "biomarker_discovery.<contrast>"), not by an arbitrary tool-name
# section -- putting them under [biodiscml] above is silently ignored (falls
# back to [DEFAULT]).
[biomarker_discovery]
cluster_cpu=%(QUART_CPU)s
cluster_mem=%(PINT_MEM)s
cluster_walltime=24:00:00

[report]
# Light: pandas/plotly on a handful of retained models' feature files, not
# BioDiscML's own training/search.
cluster_cpu=1
cluster_mem=4G
cluster_walltime=1:00:00

[log_report]
module_genpipes = mugqic/genpipes
cluster_dependency_arg=afterany
